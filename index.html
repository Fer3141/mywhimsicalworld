<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Whimsical World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Idea de layout: una sala 3D a pantalla completa (pasillo de museo verde botella con cuadros
   de bronce) que se recorre caminando; encima, una barra mínima de botones y los diálogos. */
:root{
  color-scheme: dark;
  --wall:#14211d;
  --wall-2:#1d302a;
  --brass:#c9a45c;
  --brass-dim:#8a733f;
  --paper:#f2ead8;
  --ink:#25221b;
  --flame:#ffb347;
  --text:#e8e1cf;
  --muted:#9db0a6;
  --display:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--wall);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
.hud{position:fixed;left:0;right:0;pointer-events:none;display:flex;gap:10px;padding:16px;align-items:flex-start}
.hud > *{pointer-events:auto}
.top{top:0;justify-content:flex-end;flex-wrap:wrap;background:linear-gradient(rgba(10,18,15,.75),rgba(10,18,15,0))}
.bottom{bottom:0;justify-content:center}
h1{font-family:var(--display);font-weight:600;font-size:clamp(1.5rem,4vw,2.1rem);line-height:1;margin:4px 0 0;color:var(--paper)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.btn{background:var(--brass);color:var(--ink);border:0;border-radius:999px;padding:9px 16px;font-weight:600}
.btn:hover{background:#d8b56f}
.btn.ghost{background:rgba(10,18,15,.6);color:var(--text);border:1px solid var(--brass-dim)}
.btn.ghost:hover{border-color:var(--brass);background:rgba(201,164,92,.16)}
:focus-visible{outline:2px solid var(--flame);outline-offset:3px}
.hint{background:rgba(10,18,15,.72);border:1px solid rgba(157,176,166,.3);border-radius:999px;padding:8px 16px;font-size:.9rem;color:var(--text);text-align:center}
.pad{position:fixed;left:16px;bottom:64px;display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px;touch-action:none;user-select:none;-webkit-user-select:none}
.pad button{background:rgba(10,18,15,.7);color:var(--text);border:1px solid var(--brass-dim);border-radius:12px;font-size:1.1rem}
.pad button:active{background:rgba(201,164,92,.35)}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
@media (pointer:coarse){.pad{display:grid}}
.chatlog{position:fixed;left:16px;bottom:120px;display:grid;gap:4px;max-width:min(420px,calc(100% - 32px));pointer-events:none}
.chatlog p{margin:0;background:rgba(10,18,15,.72);border:1px solid rgba(157,176,166,.25);border-radius:10px;padding:5px 10px;font-size:.9rem;color:var(--text);overflow-wrap:anywhere}
.chatlog b{color:var(--brass);font-weight:600}
.chatbar{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);display:flex;gap:8px;width:min(560px,calc(100% - 32px));z-index:5}
.chatbar[hidden]{display:none}
.chatbar input{flex:1;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (pointer:coarse){.chatlog{bottom:190px}}
.nogl{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center}
.nogl p{max-width:44ch;color:var(--muted)}

dialog{border:1px solid var(--brass-dim);border-radius:8px;background:var(--wall-2);color:var(--text);width:min(620px, calc(100% - 32px));max-height:calc(100% - 32px);padding:0}
dialog::backdrop{background:rgba(6,12,10,.6)}
.dlg{padding:30px clamp(20px,5vw,40px) 26px;display:grid;gap:16px}
.dlg blockquote{margin:0;font-family:var(--display);font-style:italic;font-size:clamp(1.6rem,4.5vw,2.2rem);line-height:1.2;color:var(--paper);text-wrap:balance}
.meta{color:var(--muted);margin:0}
.meta strong{color:var(--text);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.status{min-height:1.4em;margin:0;color:var(--brass);font-size:.92rem}
.close{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--muted);font-size:1.5rem;line-height:1;padding:6px 10px;border-radius:6px}
.close:hover{color:var(--text)}
label{display:grid;gap:6px;font-size:.9rem;color:var(--muted)}
textarea,input[type=text]{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--brass-dim);border-radius:6px;padding:10px 12px;width:100%}
textarea{min-height:96px;resize:vertical}
h2{font-family:var(--display);font-weight:600;font-size:1.7rem;margin:0;color:var(--paper)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.list button{width:100%;text-align:left;background:transparent;border:1px solid rgba(157,176,166,.25);border-radius:6px;color:var(--text);padding:10px 12px;display:grid;gap:2px}
.list button:hover{border-color:var(--brass)}
.list .t{font-family:var(--display);font-size:1.15rem;line-height:1.2;color:var(--paper)}
.list .a{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.note{color:var(--muted);font-size:.84rem;margin:0}
</style>
</head>
<body>
<div id="stage"></div>

<div class="hud top">
  <div class="tools"><span class="hint" id="who" hidden></span><button class="btn ghost" id="chatBtn" type="button">Chat (Enter)</button></div>
</div>
<div class="hud bottom">
  <div class="hint" id="hint">Flechas para caminar · Shift para correr · Arrastrá para mirar · Enter para chatear</div>
</div>

<div class="pad" id="pad" aria-label="Caminar">
  <button type="button" data-k="arrowup" class="u" aria-label="Avanzar">▲</button>
  <button type="button" data-k="arrowleft" class="l" aria-label="Izquierda">◀</button>
  <button type="button" data-k="arrowdown" class="d" aria-label="Retroceder">▼</button>
  <button type="button" data-k="arrowright" class="r" aria-label="Derecha">▶</button>
</div>

<div class="chatlog" id="chatlog" aria-live="polite"></div>
<form class="chatbar" id="chatbar" hidden>
  <label for="chatInput" class="sr">Mensaje</label>
  <input type="text" id="chatInput" maxlength="140" autocomplete="off" placeholder="Escribí un mensaje y apretá Enter">
  <button class="btn" type="submit">Enviar</button>
</form>

<div class="nogl" id="nogl">
  <div>
    <p>Este navegador no pudo abrir la casa en 3D.</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";
  var QUOTES = [
    {id:"a1", a:"Aristóteles", w:"Metafísica, libro I", t:"Todos los hombres desean por naturaleza saber."},
    {id:"c1", a:"Sócrates", w:"Platón, Apología de Sócrates", t:"Una vida sin examen no merece ser vivida."},
    {id:"a2", a:"Aristóteles", w:"Política, libro I", t:"El hombre es por naturaleza un animal político."},
    {id:"m1", a:"René Descartes", w:"Discurso del método, 1637", t:"Pienso, luego existo."},
    {id:"a3", a:"Aristóteles", w:"Ética a Nicómaco, libro I", t:"Una golondrina no hace verano."},
    {id:"c3", a:"Platón", w:"República, libro II", t:"El comienzo es la parte más importante de toda obra."},
    {id:"a4", a:"Aristóteles", w:"Ética a Nicómaco, libro VIII", t:"La amistad es lo más necesario para la vida."},
    {id:"c6", a:"Séneca", w:"Cartas a Lucilio, carta 1", t:"Mientras se aplaza, la vida pasa."},
    {id:"a5", a:"Aristóteles", w:"Metafísica, libro I", t:"Los hombres comenzaron a filosofar movidos por la admiración."},
    {id:"o1", a:"Confucio", w:"Analectas, II, 15", t:"Aprender sin pensar es inútil; pensar sin aprender, peligroso."},
    {id:"a6", a:"Aristóteles", w:"Ética a Nicómaco, libro II", t:"La virtud es un término medio entre dos vicios."},
    {id:"c2", a:"Sócrates", w:"atribuida, a partir de la Apología de Platón", t:"Solo sé que no sé nada."},
    {id:"c4", a:"Heráclito", w:"atribuida", t:"Nadie se baña dos veces en el mismo río."},
    {id:"c5", a:"Protágoras", w:"fragmento citado por Platón en el Teeteto", t:"El hombre es la medida de todas las cosas."},
    {id:"c7", a:"Epicteto", w:"Enquiridión, 5", t:"A los hombres los perturban sus opiniones sobre las cosas."},
    {id:"c8", a:"Terencio", w:"El atormentador de sí mismo", t:"Soy hombre: nada humano me es ajeno."},
    {id:"c9", a:"Horacio", w:"Odas, I, 11", t:"Aprovecha el día y confía lo menos posible en el mañana."},
    {id:"c10", a:"Virgilio", w:"Églogas, X", t:"El amor todo lo vence."},
    {id:"o2", a:"Lao Tse", w:"Tao Te King, 64", t:"Un viaje de mil millas comienza con un solo paso."},
    {id:"m2", a:"Blaise Pascal", w:"Pensamientos", t:"El corazón tiene razones que la razón no conoce."},
    {id:"m3", a:"Immanuel Kant", w:"¿Qué es la Ilustración?, 1784", t:"Ten el valor de servirte de tu propio entendimiento."},
    {id:"m4", a:"Friedrich Nietzsche", w:"El ocaso de los ídolos, 1889", t:"Quien tiene un porqué para vivir puede soportar casi cualquier cómo."},
    {id:"m5", a:"William Shakespeare", w:"Hamlet, acto III", t:"Ser o no ser, esa es la cuestión."},
    {id:"m6", a:"Miguel de Cervantes", w:"Don Quijote, II, 58", t:"La libertad, Sancho, es uno de los más preciosos dones que a los hombres dieron los cielos."},
    {id:"m7", a:"José Ortega y Gasset", w:"Meditaciones del Quijote, 1914", t:"Yo soy yo y mi circunstancia."}
  ];
  var KEY = "sala-frases-v1";
  var state = {candles:{}, flowers:{}, mine:[]};
  try{
    var saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if(saved && typeof saved === "object"){
      state.candles = saved.candles || {};
      state.flowers = saved.flowers || {};
      state.mine = Array.isArray(saved.mine) ? saved.mine : [];
    }
  }catch(e){}
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

  var $ = function(id){ return document.getElementById(id); };
  function on(id, ev, fn){ var e = $(id); if(e) e.addEventListener(ev, fn); }
  var view = $("view"), add = $("add"), list = $("list");
  var current = null, has3d = false;

  function all(){
    return QUOTES.concat(state.mine.map(function(m){
      return {id:m.id, a:m.a, w:"colgada por vos", t:m.t, mine:true};
    }));
  }
  function byId(id){ return all().filter(function(q){ return q.id === id; })[0]; }
  function el(tag, cls, text){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text != null) n.textContent = text;
    return n;
  }
  var now = new Date();
  var day = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 86400000);
  var today = QUOTES[day % QUOTES.length];

  /* ---------- Diálogos ---------- */
  function refreshView(msg){
    var q = current; if(!q) return;
    $("viewText").textContent = "«" + q.t + "»";
    var meta = $("viewMeta"); meta.textContent = "";
    meta.appendChild(el("strong", null, q.a));
    meta.appendChild(document.createTextNode(" · " + q.w));
    $("candleBtn").textContent = state.candles[q.id] ? "Apagar mi vela" : "Encender una vela";
    $("removeBtn").hidden = !q.mine;
    var n = state.flowers[q.id] || 0;
    $("viewStatus").textContent = msg || (
      (state.candles[q.id] ? "Tu vela está encendida. " : "") +
      (n ? "Dejaste " + n + (n === 1 ? " flor." : " flores.") : ""));
  }
  function openView(id){
    current = byId(id); if(!current) return;
    refreshView();
    if(!view.open) view.showModal();
  }
  on("candleBtn", "click", function(){
    if(state.candles[current.id]) delete state.candles[current.id];
    else state.candles[current.id] = true;
    save(); refreshView(); syncFrames();
  });
  on("flowerBtn", "click", function(){
    state.flowers[current.id] = (state.flowers[current.id] || 0) + 1;
    save(); refreshView(); syncFrames();
  });
  on("copyBtn", "click", function(){
    var text = "«" + current.t + "» — " + current.a;
    var done = function(){ refreshView("Frase copiada."); };
    var fail = function(){ refreshView("No se pudo copiar. Seleccioná el texto y copialo a mano."); };
    try{ navigator.clipboard.writeText(text).then(done, fail); }catch(e){ fail(); }
  });
  on("removeBtn", "click", function(){
    var id = current.id;
    state.mine = state.mine.filter(function(m){ return m.id !== id; });
    delete state.candles[id]; delete state.flowers[id];
    save(); view.close(); buildHall();
  });
  function openList(){
    var ul = $("listItems"); ul.textContent = "";
    all().forEach(function(q){
      var li = el("li"), b = el("button");
      b.type = "button";
      b.appendChild(el("span","t", q.t));
      b.appendChild(el("span","a", q.a + (state.candles[q.id] ? " · con tu vela" : "")));
      b.addEventListener("click", function(){ list.close(); goTo(q.id); });
      li.appendChild(b); ul.appendChild(li);
    });
    list.showModal();
  }
  on("openList", "click", openList);
  on("noglList", "click", openList);
  on("openToday", "click", function(){ goTo("today"); });
  on("openAdd", "click", function(){ add.showModal(); $("addText").focus(); });
  on("addForm", "submit", function(ev){
    ev.preventDefault();
    var t = $("addText").value.trim().replace(/^[«"“]+|[»"”]+$/g, "");
    var a = $("addAuthor").value.trim();
    if(!t || !a) return;
    var id = "u" + Date.now();
    state.mine.push({id:id, t:t, a:a});
    save(); ev.target.reset(); add.close();
    buildHall(); goTo(id, true);
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-close]"), function(b){
    b.addEventListener("click", function(){ b.closest("dialog").close(); });
  });
  [view, add, list].forEach(function(d){
    if(!d) return;
    d.addEventListener("click", function(ev){ if(ev.target === d) d.close(); });
  });

  /* ---------- otras personas conectadas: presencia y chat ---------- */
  var roomNs = null, userNs = null, remotes = {}, myMsgN = 0, sendClock = 0, lastState = "", names = {};
  // cartel de texto que siempre mira a la cámara: globo de chat o nombre
  function textSprite(bubble){
    var c = document.createElement("canvas"); c.width = 512; c.height = bubble ? 192 : 96;
    var x = c.getContext("2d"), tex = new THREE.CanvasTexture(c);
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({map: tex, transparent: true, depthWrite: false, fog: false}));
    sp.scale.set(bubble ? 3.4 : 2.2, bubble ? 1.275 : 0.4125, 1); sp.visible = false;
    function set(text){
      x.clearRect(0, 0, c.width, c.height);
      x.font = (bubble ? "500 34px" : "600 40px") + " Figtree, system-ui, sans-serif";
      var words = String(text).split(/\s+/), lines = [], line = "";
      words.forEach(function(w){
        while(x.measureText(w).width > 460){ var cutAt = Math.max(1, Math.floor(w.length * 460 / x.measureText(w).width)); lines.push(w.slice(0, cutAt)); w = w.slice(cutAt); }
        var test = line ? line + " " + w : w;
        if(x.measureText(test).width > 460 && line){ lines.push(line); line = w; } else line = test;
      });
      if(line) lines.push(line);
      var maxL = bubble ? 4 : 1;
      if(lines.length > maxL){ lines = lines.slice(0, maxL); lines[maxL - 1] = lines[maxL - 1].slice(0, -1) + "…"; }
      var wmax = 0; lines.forEach(function(l){ wmax = Math.max(wmax, x.measureText(l).width); });
      var lh = bubble ? 40 : 46, bw = wmax + 44, bh = lines.length * lh + 26, bx = (c.width - bw) / 2, byy = c.height - bh - (bubble ? 16 : 6);
      x.fillStyle = bubble ? "rgba(255,255,255,.96)" : "rgba(10,18,15,.72)";
      x.beginPath(); x.moveTo(bx + 16, byy); x.arcTo(bx + bw, byy, bx + bw, byy + bh, 16); x.arcTo(bx + bw, byy + bh, bx, byy + bh, 16); x.arcTo(bx, byy + bh, bx, byy, 16); x.arcTo(bx, byy, bx + bw, byy, 16); x.fill();
      if(bubble){ x.beginPath(); x.moveTo(246, byy + bh - 1); x.lineTo(256, byy + bh + 14); x.lineTo(266, byy + bh - 1); x.fill(); }
      x.fillStyle = bubble ? "#25221b" : "#f2ead8"; x.textAlign = "center"; x.textBaseline = "middle";
      lines.forEach(function(l, i){ x.fillText(l, c.width / 2, byy + 13 + lh / 2 + i * lh); });
      tex.needsUpdate = true; sp.visible = true;
    }
    return {sprite: sp, set: set, t: 0};
  }
  function cleanText(v){
    return String(v == null ? "" : v).replace(/[\u0000-\u001f\u007f-\u009f​-‏‪-‮⁠-⁯﻿]/g, " ").replace(/\s+/g, " ").trim().slice(0, 140);
  }
  function logLine(who, text){
    var box = $("chatlog"), pEl = document.createElement("p"), b = document.createElement("b");
    b.textContent = who + ": "; pEl.appendChild(b); pEl.appendChild(document.createTextNode(text));
    box.appendChild(pEl);
    while(box.children.length > 7) box.removeChild(box.firstChild);
    setTimeout(function(){ if(pEl.parentNode) pEl.parentNode.removeChild(pEl); }, 25000);
  }
  function nameOf(r){ return names[r.by] || "Vecina " + r.num; }
  function showCount(){
    var n = Object.keys(remotes).length, w = $("who");
    if(!roomNs){ w.hidden = !roomTried; w.textContent = "Sin conexión con otras personas: pedí que te inviten por correo y entrá con tu cuenta"; return; }
    w.hidden = false; w.textContent = n ? (n + 1) + " personas en el pueblo" : "Conectada · todavía no hay nadie más";
  }
  var remoteN = 0, roomTried = false;
  function ensureRemote(p){
    var r = remotes[p.peer];
    if(r) return r;
    var av = makeWitch();
    r = remotes[p.peer] = {av: av, x: pos.x, z: pos.z, y: 0, yaw: 0, tx: null, n: null, seen: false, ph: 0, by: p.by, num: ++remoteN};
    r.bubble = textSprite(true); r.bubble.sprite.position.y = 2.25; av.group.add(r.bubble.sprite);
    r.label = textSprite(false); r.label.sprite.position.y = 1.78; av.group.add(r.label.sprite);
    r.label.set(nameOf(r)); av.group.visible = false;
    if(userNs && userNs.profiles && p.by && !names[p.by]){
      userNs.profiles([p.by]).then(function(ps){
        var nm = ps && ps[p.by] && ps[p.by].name;
        if(nm){ names[p.by] = cleanText(nm).slice(0, 28); r.label.set(nameOf(r)); }
      }, function(){});
    }
    return r;
  }
  function applyRemote(p){
    if(p.sameTab || p.kind !== "viewer") return;
    var r = ensureRemote(p), pr = p.presence || {};
    function num(v, lo, hi){ return typeof v === "number" && isFinite(v) ? Math.max(lo, Math.min(hi, v)) : null; }
    var nx = num(pr.x, -122, 122), nz = num(pr.z, -97, 116);
    if(nx != null && nz != null){
      if(r.tx == null){ r.x = nx; r.z = nz; r.y = num(pr.y, 0, 6) || 0; }
      r.tx = nx; r.tz = nz; r.ty = num(pr.y, 0, 6) || 0; r.tyaw = num(pr.yaw, -1000, 1000) || 0;
      r.av.group.visible = true;
    }
    if(typeof pr.msg === "string" && pr.n !== r.n){
      if(r.seen){ var txt = cleanText(pr.msg); if(txt){ r.bubble.set(txt); r.bubble.t = 7; logLine(nameOf(r), txt); } }
      r.n = pr.n;
    }
    r.seen = true;
  }
  function dropRemote(p){
    var r = remotes[p.peer]; if(!r) return;
    scene.remove(r.av.group);
    r.av.group.traverse(function(o){ if(o.geometry) o.geometry.dispose(); if(o.material && o.material.map) o.material.map.dispose(); });
    delete remotes[p.peer];
  }
  function onPeersChange(ch){
    ch.joined.forEach(applyRemote); ch.updated.forEach(applyRemote); ch.left.forEach(dropRemote);
    showCount();
  }
  function updateRemotes(dt, moving){
    var k = Math.min(1, dt * 9);
    for(var id in remotes){
      var r = remotes[id]; if(r.tx == null) continue;
      var dx = r.tx - r.x, dz = r.tz - r.z, d = Math.sqrt(dx * dx + dz * dz);
      r.x += dx * k; r.z += dz * k; r.y += (r.ty - r.y) * k; r.yaw += angDiff(r.yaw, r.tyaw) * k;
      r.av.group.position.set(r.x, r.y, r.z); r.av.group.rotation.y = r.yaw;
      var mv = d > 0.03;
      if(mv && !reduceMotion) r.ph += dt * 11; else r.ph *= 0.8;
      var sw = mv ? Math.sin(r.ph) * 0.7 : 0;
      r.av.legL.rotation.x = sw; r.av.legR.rotation.x = -sw; r.av.armL.rotation.x = -sw * 0.7; r.av.armR.rotation.x = sw * 0.7;
      if(r.bubble.t > 0){ r.bubble.t -= dt; if(r.bubble.t <= 0) r.bubble.sprite.visible = false; }
    }

    cv.addEventListener("pointermove", function(e){
      if(!down) return;
      var dx = e.clientX - down.lx, dy = e.clientY - down.ly;
      down.lx = e.clientX; down.ly = e.clientY;
      if(Math.abs(e.clientX - down.x) + Math.abs(e.clientY - down.y) > 8) down.moved = true;
      if(down.moved){
        yaw -= dx * 0.004;
        pitch = Math.max(-0.7, Math.min(0.45, pitch - dy * 0.003));
        faceYaw = null; pending = null; focusing = false;
      }
    });
    function up(e){
      if(!down) return;
      var tap = !down.moved && performance.now() - down.t < 500;
      down = null;
      if(tap) onTap(e, cv);
    }
    cv.addEventListener("pointerup", up);
    cv.addEventListener("pointercancel", function(){ down = null; });
    cv.addEventListener("wheel", function(e){
      e.preventDefault();
      baseD = Math.max(1.6, Math.min(6, baseD + (e.deltaY > 0 ? 0.4 : -0.4)));
      focusing = false;
    }, {passive:false});
    window.addEventListener("keydown", function(e){
      if(document.querySelector("dialog[open]")) return;
      var tag = (e.target && e.target.tagName) || "";
      if(tag === "INPUT" || tag === "TEXTAREA") return;
      if(e.key === "Enter"){ e.preventDefault(); openChat(); return; }
      if(tag === "BUTTON" && e.key === " ") return;
      keys[e.key.toLowerCase()] = true;
      if(e.key.indexOf("Arrow") === 0) e.preventDefault();
    });
    window.addEventListener("keyup", function(e){ keys[e.key.toLowerCase()] = false; });
    window.addEventListener("blur", function(){ keys = {}; });
    Array.prototype.forEach.call(document.querySelectorAll("#pad button"), function(b){
      var k = b.getAttribute("data-k");
      b.addEventListener("pointerdown", function(e){ e.preventDefault(); keys[k] = true; });
      ["pointerup", "pointercancel", "pointerleave"].forEach(function(ev){
        b.addEventListener(ev, function(){ keys[k] = false; });
      });
      b.addEventListener("contextmenu", function(e){ e.preventDefault(); });
    });
  }
  function onTap(e, cv){
    var r = cv.getBoundingClientRect();
    var ndc = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    // el clic solo sirve para interactuar: abre el cuadro tocado y no mueve al personaje
    var hits = raycaster.intersectObjects(clickable.concat(floors), false);
    if(!hits.length) return;
    var key = hits[0].object.userData.key;
    if(key) openView(key === "today" ? today.id : key);
  }

  var last = 0;
  function loop(t){
    var dt = Math.min(0.05, (t - last) / 1000); last = t;
    var fw = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0);
    var st = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
    var moving = false, k = Math.min(1, dt * 4.5), px = pos.x, pz = pos.z, stepped = false;
    if(fw || st){
      var mx = -Math.sin(yaw) * fw + Math.cos(yaw) * st;
      var mz = -Math.cos(yaw) * fw - Math.sin(yaw) * st;
      var ml = Math.sqrt(mx*mx + mz*mz) || 1, sp = (keys.shift ? 7.2 : 3.6) * dt;
      pos.x += mx / ml * sp; pos.z += mz / ml * sp;
      charYaw += angDiff(charYaw, Math.atan2(-mx, -mz)) * Math.min(1, dt * 10);
      moving = true; target = null; pending = null; faceYaw = null; focusing = false; route = []; clampPos();
    }else if(target){
      var dx = target.x - pos.x, dz = target.z - pos.z, dist = Math.sqrt(dx*dx + dz*dz);
      if(dist > 0.05){
        var step = Math.min(dist, 3.8 * dt);
        pos.x += dx / dist * step; pos.z += dz / dist * step;
        var travel = Math.atan2(-dx, -dz);
        charYaw += angDiff(charYaw, travel) * Math.min(1, dt * 10);
        moving = true; stepped = true;
      }else if(route.length){
        target = route.shift();
        if(!route.length) faceYaw = faceYawFinal;
      }else if(faceYaw != null && Math.abs(angDiff(yaw, faceYaw)) > 0.03){
        focusing = true;
        charYaw += angDiff(charYaw, faceYaw) * Math.min(1, dt * 10);
        yaw += angDiff(yaw, faceYaw) * Math.min(1, dt * 5);
      }else{
        if(faceYaw != null){ focusing = true; charYaw = faceYaw; }
        target = null; faceYaw = null;
        if(pending){ var id = pending; pending = null; openView(id); }
      }
    }
    collide(px, pz);
    if(stepped && Math.abs(pos.x - px) + Math.abs(pos.z - pz) < 0.002){ stopWalk(); moving = false; }
    if(focusing) pitch += (0.04 - pitch) * k;
    camD += ((focusing ? focusD : baseD) - camD) * k;
    pivotY += ((focusing ? 1.9 : 1.3) - pivotY) * k;
    var cp = Math.cos(pitch);
    var cx = pos.x + Math.sin(yaw) * cp * camD, cz = pos.z + Math.cos(yaw) * cp * camD;
    var cy = pivotY - Math.sin(pitch) * camD;
    var ty = lvl === 1 ? H1 : (lvl === "s" ? stairY(pos.z) : (onDock(pos.x, pos.z) ? 0.36 : 0));
    heroY += (ty - heroY) * Math.min(1, dt * 14);
    cy += heroY;
    cy = Math.max(heroY + 0.5, cy);
    if(inside){
      var cl = (lvl === 1 || (lvl === "s" && heroY > H1 * 0.6)) ? 1 : 0, cws = walls[cl], tmin = 1;
      for(var wi = 0; wi < cws.length; wi++){
        var cwl = cws[wi];
        if(!cwl.cam) continue;
        var h0 = cwl.ax === "x" ? pos.x : pos.z, c0 = cwl.ax === "x" ? cx : cz;
        if((h0 - cwl.c) * (c0 - cwl.c) >= 0) continue;
        var tt2 = (cwl.c - h0) / (c0 - h0);
        var qq = cwl.ax === "x" ? pos.z + tt2 * (cz - pos.z) : pos.x + tt2 * (cx - pos.x);
        if(qq < cwl.a - 0.2 || qq > cwl.b + 0.2) continue;
        var through = false;
        for(var gi = 0; gi < cwl.gaps.length; gi++)
          if(qq > cwl.gaps[gi][0] + 0.25 && qq < cwl.gaps[gi][1] - 0.25 && (heroY + pivotY + tt2 * (cy - heroY - pivotY)) - heroY < 2.3) through = true;
        if(!through && tt2 < tmin) tmin = tt2;
      }
      if(tmin < 1){
        var cl2 = Math.sqrt((cx - pos.x) * (cx - pos.x) + (cz - pos.z) * (cz - pos.z)) || 1;
        var fct = Math.max(0.08, (tmin * cl2 - 0.4) / cl2);
        cx = pos.x + (cx - pos.x) * fct; cz = pos.z + (cz - pos.z) * fct;
      }
      if(lvl === 0) cy = Math.min(H1 - 0.45, cy);
      else{
        cy = Math.min(H1 + H2 - 0.3, cy);
        if(lvl === 1) cy = Math.max(H1 + 0.4, cy);
      }
    }
    camera.position.set(cx, cy, cz);
    camera.rotation.y = yaw; camera.rotation.x = pitch;
    sky.position.copy(camera.position);
    updateLife(dt, t);
    updateRemotes(dt, moving);
    if(hall) hall.visible = pos.x * pos.x + (pos.z + 9) * (pos.z + 9) < 150 * 150;
    if(interiorG) interiorG.visible = pos.x * pos.x + (pos.z + 9) * (pos.z + 9) < 40 * 40;
    moon.position.set(camera.position.x + MOON_DIR.x * MOON_DIST, camera.position.y + MOON_DIR.y * MOON_DIST, camera.position.z + MOON_DIR.z * MOON_DIST);
    moonGlow.position.copy(moon.position);
    sun.position.set(camera.position.x + SUN_DIR.x * MOON_DIST, camera.position.y + SUN_DIR.y * MOON_DIST, camera.position.z + SUN_DIR.z * MOON_DIST);
    sunGlow.position.copy(sun.position);
    for(var xi = 0; xi < xmas.length; xi++){
      var xm = xmas[xi], xf = reduceMotion ? 1 : 0.55 + 0.45 * Math.sin(t * 0.004 + xm.ph);
      xm.m.color.copy(xm.base).multiplyScalar(xf);
    }
    for(var ui = 0; ui < auroras.length; ui++){
      var au = auroras[ui];
      au.m.position.set(camera.position.x, camera.position.y + 62 + ui * 8, camera.position.z);
      if(!reduceMotion){
        au.tex.offset.x += dt * au.sp;
        au.m.material.opacity = 0.62 + 0.2 * Math.sin(t * 0.0007 + au.ph);
      }
    }
    for(var di = 0; di < doors.length; di++){
      var dr = doors[di];
      var sameLvl = dr.lvl === 0 ? heroY < 1.5 : heroY > H1 - 1.5;
      var ddx = pos.x - dr.cx, ddz = pos.z - dr.cz;
      var near = sameLvl && ddx * ddx + ddz * ddz < 5.3;
      dr.a += ((near ? 1.5 : 0) - dr.a) * Math.min(1, dt * (reduceMotion ? 30 : 5));
      dr.g.rotation.y = dr.r0 + dr.sgn * dr.a;
    }
    for(var fi = 0; fi < fireflies.length; fi++){
      var ff = fireflies[fi], tt = reduceMotion ? 0 : t * 0.001;
      ff.s.position.set(ff.x + Math.sin(tt * 0.5 + ff.ph) * 1.2, ff.y + Math.sin(tt * 0.9 + ff.ph * 2) * 0.35, ff.z + Math.cos(tt * 0.4 + ff.ph) * 1.2);
      var sc = ff.sz * (0.7 + 0.3 * Math.sin(tt * 2.2 + ff.ph * 3));
      ff.s.scale.set(sc, sc, 1);
    }
    if(hero){
      if(moving && !reduceMotion) walkPhase += dt * 11; else walkPhase *= 0.8;
      var sw = moving ? Math.sin(walkPhase) * 0.7 : 0;
      hero.legL.rotation.x = sw; hero.legR.rotation.x = -sw;
      hero.armL.rotation.x = -sw * 0.7; hero.armR.rotation.x = sw * 0.7;
      hero.fig.position.y = moving ? Math.abs(Math.sin(walkPhase)) * 0.03 : 0;
      hero.group.position.set(pos.x, heroY, pos.z);
      hero.group.rotation.y = charYaw;
    }
    if(!reduceMotion){
      var fk = 1.8 + Math.sin(t * 0.012) * 0.18 + Math.sin(t * 0.031) * 0.1;
      for(var key in frames){ if(frames[key].flame.visible) frames[key].flame.scale.y = fk; }
    }
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }

  function start(){ if(start.done) return; start.done = true; init3d(); }
  if(typeof THREE === "undefined"){ $("nogl").style.display = "grid"; $("hint").hidden = true; }
  else{
    var fontsReady = (document.fonts && document.fonts.load)
      ? Promise.all([document.fonts.load('500 60px "Cormorant Garamond"'), document.fonts.load('600 26px Figtree')])
      : Promise.resolve();
    fontsReady.then(start, start);
    setTimeout(start, 2500);
  }
  window.__sala = {fake: function(ch){ onPeersChange(ch); }, st: function(){ return {x: +pos.x.toFixed(2), d: +(M.zA - pos.z).toFixed(2), lvl: lvl, y: +heroY.toFixed(2), calls: renderer.info.render.calls, tris: renderer.info.render.triangles}; }, tp: function(x, d, l, y, p){ pos.x = x; pos.z = M.zA - d; lvl = l; heroY = l ? H1 : 0; inside = true; yaw = y; charYaw = y; if(p != null) pitch = p; }};
})();
</script>
</body>
